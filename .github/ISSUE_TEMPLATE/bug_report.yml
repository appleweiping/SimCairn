name: Bug report
description: Report planning, execution, cache, journal, or CLI behavior
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use synthetic input only. Do not attach PDK files, secrets, or proprietary decks.
  - type: input
    id: version
    attributes:
      label: SimCairn version
    validations:
      required: true
  - type: textarea
    id: manifest
    attributes:
      label: Minimal synthetic manifest and deck
      render: toml
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior, exit status, and journal state
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Python, operating system, and simulator version
    validations:
      required: true
