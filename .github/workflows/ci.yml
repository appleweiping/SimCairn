name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca # v1.7.12

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11", quality: true}
          - {os: ubuntu-latest, python-version: "3.12", quality: false}
          - {os: ubuntu-latest, python-version: "3.13", quality: false}
          - {os: ubuntu-latest, python-version: "3.14", quality: false}
          - {os: windows-latest, python-version: "3.11", quality: false}
          - {os: windows-latest, python-version: "3.14", quality: false}
          - {os: macos-latest, python-version: "3.11", quality: false}
          - {os: macos-latest, python-version: "3.14", quality: false}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install uv==0.11.21
      - run: uv sync --frozen --extra dev
      - if: matrix.quality
        run: uv run --frozen ruff check . && uv run --frozen ruff format --check .
      - if: matrix.quality
        run: uv run --frozen mypy --python-version 3.11 src
      - if: matrix.quality
        run: uv run --frozen bandit -q -r src
      - run: uv run --frozen pytest --cov=simcairn --cov-report=term-missing
      - if: matrix.quality
        run: uv run --frozen python -m build

  ngspice-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
      - name: Install ngspice and SimCairn
        run: |
          sudo apt-get update
          sudo apt-get install --yes ngspice
          python -m pip install uv==0.11.21
          uv sync --frozen --extra dev
      - name: Verify the pinned ngspice 42 numeric reference
        run: |
          version_output="$(ngspice --version)"
          printf '%s\n' "$version_output"
          printf '%s\n' "$version_output" | grep -Eiq 'ngspice-42([^0-9]|$)'
          uname -a
          sha256sum "$(command -v ngspice)"
          uv run --frozen simcairn run examples/rc_pvt/ngspice.toml --store .ngspice-reference-store
          bundle="$(find .ngspice-reference-store/cache -path '*/files/regression-bundle.json' -print -quit)"
          test -n "$bundle"
          uv run --frozen python benchmarks/verify_reference.py "$bundle" benchmarks/results/ngspice-42-rc-pvt.json
