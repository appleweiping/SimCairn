[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "simcairn"
version = "0.1.0"
description = "Resumable local orchestration for reproducible SPICE activities"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Weiping Yan" }]
keywords = ["spice", "eda", "simulation", "workflow", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "bandit>=1.8",
  "build>=1.2",
  "coverage[toml]>=7.6",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-asyncio>=0.25",
  "pytest-cov>=6.0",
  "ruff>=0.9",
]

[project.scripts]
simcairn = "simcairn.cli:entrypoint"

[project.urls]
Documentation = "https://github.com/appleweiping/SimCairn#readme"
Issues = "https://github.com/appleweiping/SimCairn/issues"
Source = "https://github.com/appleweiping/SimCairn"

[tool.hatch.build.targets.wheel]
packages = ["src/simcairn"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/examples",
  "/docs",
  "/*.md",
  "/LICENSE",
]
exclude = ["/.github", "/uv.lock"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["simcairn"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true

[tool.bandit]
targets = ["src"]
